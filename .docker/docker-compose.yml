services:
  postgres:
    image: postgres:16-alpine
    container_name: pr_ledger_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: pr_ledger
    ports:
      - "5432:5432"
    volumes:
      - pr_ledger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d pr_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pr_ledger_pgdata: